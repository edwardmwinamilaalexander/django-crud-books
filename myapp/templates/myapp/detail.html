{% extends 'myapp/base.html' %}
{% block body%}

<div class="container mt-4">
    <div class="row">

        <div class="col-md-1">
        </div>

        <div class="col-md-4">
            <img width="300" height="400" src="{{ book.book_image.url}}">
        </div>

        <div class="col-md-6">
            <h2>{{ book.name }}</h2>
            <p>{{ book.description }}</p>
            <h6>£ {{ book.price }}</h6>
            <a class="btn btn-warning" href="{% url 'myapp:update'  book.id %}">Update </a>
            <a class="btn btn-danger" href="{% url 'myapp:delete'  book.id %}">Delete </a>

        </div>

        <div class="col-md-1">
        </div>
    </div>
</div>
<div class="mt-2 text-center">
    <a class="btn btn-primary" href="{% url 'myapp:index' %}">Back to home page</a>
</div>

{% endblock %}
